name: Nexus
options:
  bundleIdPrefix: it.quaderno.registro
  deploymentTarget:
    iOS: "16.0"
targets:
  Nexus:
    type: application
    platform: iOS
    sources: [Nexus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.quaderno.registro.ios
        PRODUCT_NAME: Nexus
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    info:
      path: Nexus/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [it.quaderno.registro.ios.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
