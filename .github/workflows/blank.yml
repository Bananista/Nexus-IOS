name: Compila e Verifica iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compila Package Swift
        run: |
          PKG_FILE=$(find . -name "Package.swift" | head -n 1)
          PKG_DIR=$(dirname "$PKG_FILE")
          swift build --package-path "$PKG_DIR"

      - name: Salva Artefatto Progetto
        uses: actions/upload-artifact@v4
        with:
          name: Quaderno-iOS-Source
          path: .
