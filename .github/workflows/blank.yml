name: Compila e Verifica iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug e Compilazione Automatica
        run: |
          echo "--- CERCO PACKAGE.SWIFT ---"
          PKG_FILE=$(find . -name "Package.swift" | head -n 1)
          PKG_DIR=$(dirname "$PKG_FILE")
          
          swift build --package-path "$PKG_DIR"
