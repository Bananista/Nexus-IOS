name: Compila e Verifica iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decomprimi archivio ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Decompressione di $ZIP_FILE..."
          unzip -qo "$ZIP_FILE"

      - name: Compila Package Swift
        run: |
          DIR_NAME=$(find . -maxdepth 1 -type d -name "Quaderno-ios*" | head -n 1)
          swift build --package-path "$DIR_NAME"

      - name: Esegui Test
        run: |
          DIR_NAME=$(find . -maxdepth 1 -type d -name "Quaderno-ios*" | head -n 1)
          swift test --package-path "$DIR_NAME"
