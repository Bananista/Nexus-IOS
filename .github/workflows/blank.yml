name: Compila e Verifica iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compila Package Swift
        run: swift build --package-path .

      - name: Esegui Test
        run: swift test --package-path .
