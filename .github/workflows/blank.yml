name: Compila e Verifica iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trova e Compila Package Swift
        run: |
          DIR=$(dirname "$(find . -name "Package.swift" | head -n 1)")
          echo "Trovato Package.swift in: $DIR"
          swift build --package-path "$DIR"

      - name: Esegui Test
        run: |
          DIR=$(dirname "$(find . -name "Package.swift" | head -n 1)")
          swift test --package-path "$DIR"
