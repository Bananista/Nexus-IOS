name: Build iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scompatta lo zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "Nessuno zip nel repository: caricalo"; exit 1; fi
          mkdir -p src && unzip -q -o "$Z" -d src
          F=$(find src -name project.yml | head -1)
          if [ -z "$F" ]; then echo "project.yml non trovato nello zip"; exit 1; fi
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - name: Genera il progetto Xcode
        working-directory: ${{ env.DIR }}
        run: brew install xcodegen && xcodegen generate
      - name: Compila (senza firma)
        working-directory: ${{ env.DIR }}
        run: |
          xcodebuild -project Nexus.xcodeproj -scheme Nexus -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Crea l'IPA
        working-directory: ${{ env.DIR }}
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Nexus.app Payload/
          zip -qr Nexus.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-ipa
          path: ${{ env.DIR }}/Nexus.ipa
